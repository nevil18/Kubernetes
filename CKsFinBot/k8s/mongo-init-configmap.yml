apiVersion: v1
kind: ConfigMap
metadata:
  name: mongo-init-script
  namespace: finbot
data:
  init.js: |
    db = db.getSiblingDB('admin');
    db.createUser({
      user: process.env.MONGO_INITDB_ROOT_USERNAME,
      pwd: process.env.MONGO_INITDB_ROOT_PASSWORD,
      roles: [{role: 'root', db: 'admin'}]
    });
    db = db.getSiblingDB('FinanceChatbotDB');
    db.createUser({
      user: process.env.MONGO_INITDB_ROOT_USERNAME,
      pwd: process.env.MONGO_INITDB_ROOT_PASSWORD,
      roles: [{role: 'readWrite', db: 'FinanceChatbotDB'}]
    });
