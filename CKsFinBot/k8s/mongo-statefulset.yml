apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: finbot
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7.0
          command: ["mongod"]
          args: ["--replSet", "rs0", "--bind_ip_all"]
          ports:
            - containerPort: 27017
          lifecycle:
            postStart:
              exec:
                command:
                  - bash
                  - -c
                  - |
                    sleep 15
                    mongosh --eval "
                      try { rs.status(); } catch(e) {
                        rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo-0.mongo.finbot.svc.cluster.local:27017'}]});
                      }
                    " || true
          envFrom:
            - secretRef:
                name: mongo-secret
            - configMapRef:
                name: mongo-config
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
            - name: mongo-init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: mongo-data
          persistentVolumeClaim:
            claimName: mongo-pvc
        - name: mongo-init
          configMap:
            name: mongo-init-script
